name: update-prices
on:
  schedule: [{cron: '17 */3 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: prices, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python fetch_prices.py
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || (git commit -m "prices: $(date -u +%FT%TZ)" && git push)
