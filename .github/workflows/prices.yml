name: update-prices
on:
  # 실행 주기: 아래 한 줄만 바꾸면 됨. 개발 키(1,000회/일)·약 181개 → 8시간마다(약 543회/일).
  # 서비스 키로 바꾸면 예: '17 */2 * * *' (2시간마다)
  schedule: [{cron: '17 */8 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: prices, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python fetch_prices.py
        env: {NEXON_API_KEY: '${{ secrets.NEXON_API_KEY }}'}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || (git commit -m "prices: $(date -u +%FT%TZ)" && git pull --rebase && git push)
